<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="新锐期刊分区查询工具，支持期刊名搜索、DOI查询、PDF上传三种方式，一次给出新锐分区、JCR分区、影响因子与北大中文核心收录情况。">
<meta name="theme-color" content="#1a73e8">
<link rel="preconnect" href="https://api.crossref.org">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="期刊分区">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>新锐期刊分区查询</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#e74c3c;--c2:#e67e22;--c3:#2980b9;--c4:#7f8c8d;
  --bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--sub:#666;--border:#e0e0e0;
  --blue:#1a73e8;--blue-h:#1557b0;--green:#27ae60;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08);
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:var(--safe-bottom);-webkit-tap-highlight-color:transparent}
.app{max-width:500px;margin:0 auto;padding:0 16px}

/* Header */
.header{padding:20px 0 12px;display:flex;align-items:center;gap:12px}
.header-icon{width:36px;height:36px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.header h1{font-size:20px;font-weight:600}
.header .sub{font-size:12px;color:var(--sub)}

/* Mode tabs */
.modes{display:flex;gap:4px;margin-bottom:12px;background:var(--card);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow)}
.mode-btn{flex:1;padding:10px 0;text-align:center;border:none;background:none;font-size:14px;color:var(--sub);border-radius:10px;cursor:pointer;transition:all .2s;font-family:inherit}
.mode-btn.active{background:var(--blue);color:#fff;font-weight:500}

/* Input area */
.input-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;height:44px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;transition:border .2s;-webkit-appearance:none}
.input-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
.input-row input:focus-visible,.input-row textarea:focus-visible{outline:none}
#batchInput:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
.input-row button{height:44px;padding:0 20px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .2s;-webkit-appearance:none}
.input-row button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.input-row button:active{background:var(--blue-h)}
.input-row button:disabled{opacity:.5}

/* PDF upload */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:border .2s;margin-top:8px}
.upload-area:hover,.upload-area.drag{border-color:var(--blue);background:#f0f6ff}
.upload-area .icon{font-size:32px;margin-bottom:6px}
.upload-area .text{font-size:14px;color:var(--sub)}
.upload-area .hint{font-size:12px;color:#999;margin-top:4px}

/* Suggestions dropdown */
.suggestions{background:var(--card);border-radius:0 0 var(--radius) var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:320px;overflow-y:auto;position:absolute;left:16px;right:16px;z-index:10;display:none}
.suggestions.show{display:block}
.sug-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item:hover,.sug-item.sug-active{background:#f5f8ff}
.sug-name{font-size:14px;font-weight:500;margin-bottom:3px;line-height:1.3}
.sug-meta{display:flex;gap:8px;font-size:12px}
.sug-meta span{padding:2px 6px;border-radius:4px;font-weight:500}

/* Result card */
.result-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:12px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-title{font-size:16px;font-weight:600;line-height:1.4;margin-bottom:4px;color:var(--text)}
.result-issn{font-size:13px;color:var(--sub);margin-bottom:14px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-item{background:#f8f9fb;border-radius:10px;padding:12px;text-align:center}
.result-item.full{grid-column:1/-1}
.result-item .label{font-size:11px;color:var(--sub);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.result-item .value{font-size:20px;font-weight:700}
.result-item .extra{font-size:12px;color:var(--sub);margin-top:2px}

.qt-q1{color:var(--c1)}.qt-q2{color:var(--c2)}.qt-q3{color:var(--c3)}.qt-q4{color:var(--c4)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-q1{background:#fde8e8;color:var(--c1)}.badge-q2{background:#fef3e3;color:var(--c2)}
.badge-q3{background:#e8f0fe;color:var(--c3)}.badge-q4{background:#f0f0f0;color:var(--c4)}

/* States */
.state{padding:40px 20px;text-align:center}
.state .icon{font-size:40px;margin-bottom:8px}
.state .msg{font-size:14px;color:var(--sub);line-height:1.6}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Stats */
.stats{text-align:center;padding:12px;font-size:11px;color:#aaa}
.hidden{display:none!important}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:360px){
  .result-grid{grid-template-columns:1fr;gap:8px}
  .result-item .value{font-size:18px}
}
/* Multi-result responsive wrapper */
.multi-results{max-width:100%}
.multi-results .result-card{max-width:500px;margin-left:auto;margin-right:auto}

/* ===== 中文核心 (北大核心) ===== */
.badge-cn{display:inline-block;background:#c0392b;color:#fff;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600;margin:0 2px 0 0;vertical-align:middle}
.badge-cn-ed{display:inline-block;background:#fdecea;color:#c0392b;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;margin:0 4px 0 0;vertical-align:middle}
.cn-browse{max-height:296px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--border);border-radius:10px;background:#fff}
.cn-disc-head{padding:7px 12px;font-size:11px;font-weight:600;color:#fff;background:var(--blue);position:sticky;top:0;z-index:1;letter-spacing:.2px}
.cn-disc-item{padding:10px 12px;font-size:13px;color:var(--text);border-bottom:1px solid #f2f2f2;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s}
.cn-disc-item:last-child{border-bottom:none}
.cn-disc-item:hover{background:#f7f9fc}
.cn-disc-item:active{background:#eef3fa}
.cn-disc-count{font-size:11px;color:#aaa;flex-shrink:0}
.cn-stat{font-size:11px;color:#999;text-align:center;margin-top:6px;line-height:1.5}
.cn-tip{margin-top:12px;padding:9px 12px;background:#fdf3f2;border-radius:8px;font-size:12px;color:#a5352a;line-height:1.5}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-icon">JQ</div>
    <div>
      <h1>新锐期刊分区查询</h1>
      <div class="sub">影响因子 &middot; 新锐分区 &middot; 中文核心 &middot; 2026</div>
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="modes">
    <button class="mode-btn active" data-mode="name">期刊名</button>
    <button class="mode-btn" data-mode="doi">DOI</button>
    <button class="mode-btn" data-mode="pdf">PDF上传</button>
    <button class="mode-btn" data-mode="cn">中文核心</button>
  </div>

  <!-- Input card -->
  <div class="input-card" id="inputCard">
    <!-- Name search -->
    <div id="modeName">
      <div class="input-row" style="position:relative;margin-bottom:6px">
        <input type="text" id="nameInput" placeholder="输入期刊名称或ISSN..." autocomplete="off">
        <button id="nameClearBtn" class="hidden" style="background:#999;padding:0 14px">✕</button>
        <button id="batchBtn" style="background:none;border:1px solid var(--border);color:var(--sub);padding:0 12px;font-size:12px;white-space:nowrap">批量</button>
      </div>
      <div id="batchArea" class="hidden" style="margin-top:6px">
        <textarea id="batchInput" placeholder="一行一个期刊名或DOI&#10;例如：&#10;Safety Science&#10;10.1016/j.ssci.2023.106100&#10;Tunnelling and Underground Space Technology" 
          style="width:100%;height:100px;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;resize:vertical;outline:none;-webkit-appearance:none"></textarea>
        <div class="input-row" style="margin-top:6px">
          <button id="batchDoBtn" style="flex:1;height:44px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit">批量查询</button>

      <div class="suggestions" id="suggestions"></div>

    <!-- DOI search -->

        <button id="doiBtn">查询</button>

        <button id="wxUploadBtn" style="display:block;width:100%;padding:14px;background:linear-gradient(135deg,#07c160,#06ad56);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 12px rgba(7,193,96,.3)">
          从微信聊天记录选择PDF
        </button>
        <div style="text-align:center;font-size:11px;color:#aaa;margin-top:6px">iOS用户请使用上方「点击上传」</div>
      </div>
      <input type="file" id="pdfInput" accept=".pdf" multiple class="hidden">
    </div>

    <!-- 中文核心 (北大核心 2023) -->
    <div id="modeCn" class="hidden">
      <div class="input-row" style="position:relative">
        <input type="text" id="cnInput" placeholder="输入中文期刊名，如：岩土工程学报" autocomplete="off">
        <button id="cnClearBtn" class="hidden" style="background:#999;padding:0 14px">✕</button>
        <button id="cnBrowseBtn" style="background:none;border:1px solid var(--border);color:var(--sub);padding:0 12px;font-size:12px;white-space:nowrap">按学科</button>
      </div>
      <div id="cnBrowseArea" class="cn-browse hidden" style="margin-top:8px"></div>
      <div class="suggestions" id="cnSuggestions"></div>
      <div class="cn-stat" id="cnStat">北大《中文核心期刊要目总览》2023年版 · 7 编 148 个学科</div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="state hidden">
    <div class="spinner"></div>
    <div class="msg" style="margin-top:12px" id="loadingMsg">查询中...</div>

  <!-- Results -->
  <div id="results"></div>

  <!-- Empty state -->
  <div id="emptyState" class="state">
    <div class="icon">🔍</div>
    <div class="msg">输入期刊名、DOI 或上传 PDF<br>即刻查分区和影响因子</div>
  </div>

  <!-- Data status -->
  <div class="stats" id="stats"></div>
  <div class="stats" style="padding-top:0;color:#bbb">v16 &middot; 数据来源于公开信息，仅供学术参考，不构成任何商业用途。</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== Lazy Load pdf.js ====================
// 三个 CDN 依次回退：cdnjs 在境内经常连不上，jsdelivr / unpkg 相对稳。
// 主库、worker、CMap 都吃同一个源的路径结构（都在包根目录下）。
const PDFJS_VER = '3.11.174';
const PDFJS_BASES = [
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VER + '/build/',
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/',
  'https://unpkg.com/pdfjs-dist@' + PDFJS_VER + '/build/'
];
const CMAP_BASES = [
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VER + '/cmaps/',
  'https://unpkg.com/pdfjs-dist@' + PDFJS_VER + '/cmaps/'
];
let pdfJsLoading = false, pdfJsLoaded = false, pdfJsBase = '';

function loadPdfJs() {
  return new Promise((resolve) => {
    if (pdfJsLoaded) { resolve(); return; }
    if (pdfJsLoading) {
      const check = setInterval(() => { if (pdfJsLoaded) { clearInterval(check); resolve(); } }, 100);
      return;
    }
    pdfJsLoading = true;
    let i = 0;
    const tryNext = () => {
      if (i >= PDFJS_BASES.length) { pdfJsLoading = false; resolve(); return; }
      const base = PDFJS_BASES[i++];
      const s = document.createElement('script');
      s.src = base + 'pdf.min.js';
      s.onload = () => {
        if (!window.pdfjsLib) { tryNext(); return; }   // 拿到了但没挂上（被劫持/空文件）
        pdfJsLoaded = true;
        pdfJsBase = base;
        pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
        resolve();
      };
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}

// ==================== App State ====================
const STATE = {
  journals: [],
  namesLower: [],
  total: 0,
  updated: '',
  loaded: false,
  mode: 'name',
  // 中文核心 (北大核心 2023)
  cn: null,          // {journals, names, discs, editions, discCounts, discEd, total, version, src}
  cnLoaded: false
};

// ==================== Data Loading ====================
async function loadData() {
  try {
    $('stats').textContent = '加载数据库...';
    const resp = await fetch('journal_data.json.gz');
    if (!resp.ok) throw new Error('Data fetch failed');
    const ds = new DecompressionStream('gzip');
    const stream = resp.body.pipeThrough(ds);
    const text = await new Response(stream).text();
    $('stats').textContent = '解析数据...';
    const data = JSON.parse(text);
    STATE.journals = data.journals;
    STATE.total = data.total;
    STATE.updated = data.updated;
    // Build search index: normalized names for matching
    STATE.namesLower = STATE.journals.map(j => normalizeName(j[0] || ''));
    STATE.loaded = true;
    $('stats').textContent = `已加载 ${data.total.toLocaleString()} 条期刊数据 · ${data.updated}`;
    // 中文核心库独立加载，失败不影响主库
    loadCnData();
  } catch(e) {
    console.error('Data load error:', e);
    $('stats').textContent = '数据加载失败，请刷新重试';
    setTimeout(() => loadData(), 5000);
  }
}

// ==================== 中文核心数据加载 ====================
async function loadCnData() {
  try {
    const resp = await fetch('cn_core_data.json');
    if (!resp.ok) throw new Error('CN data fetch failed: ' + resp.status);
    const wrap = await resp.json();

    // 数据文件外层为 {v, src, total, updated, enc:'gzip+base64', chunk, gz:[分块]}
    // 内层 gzip 载荷含 editions / discs / journals
    let d;
    if (wrap.gz) {
      const b64 = Array.isArray(wrap.gz) ? wrap.gz.join('') : wrap.gz;
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      d = JSON.parse(await new Response(stream).text());
    } else {
      d = wrap;
    }
    const js = d.journals || [];

    // 数据文件为紧凑三字段 [刊名, 学科下标, 编下标]：
    // 学科内序号 = 该学科内出现次序；总序号 = 文档位置
    const discEd = new Array(d.discs.length).fill(-1);
    const discCounts = new Array(d.discs.length).fill(0);
    const rows = js.map((j, i) => {
      const di = j[1];
      if (discEd[di] === -1) discEd[di] = j[2];
      const idx = ++discCounts[di];
      return [j[0], di, idx, j[2], i + 1];   // [刊名, 学科下标, 学科内序号, 编下标, 总序号]
    });

    STATE.cn = {
      journals: rows,
      names: rows.map(r => normalizeCn(r[0] || '')),
      discs: d.discs,
      editions: d.editions,
      discEd: discEd,
      discCounts: discCounts,
      total: rows.length,
      version: d.v,
      src: d.src
    };

    // 名称索引：归一化刊名 -> 条目，供 PDF / DOI / 刊名搜索等模式联查中文核心
    STATE.cn.cnMap = new Map();
    rows.forEach(r => {
      const k = normalizeCn(r[0] || '');
      if (k && !STATE.cn.cnMap.has(k)) STATE.cn.cnMap.set(k, r);
    });
    STATE.cnLoaded = true;

    const stat = $('cnStat');
    if (stat) stat.textContent = `${d.src} · 共 ${rows.length.toLocaleString()} 种 · ${d.editions.length} 编 ${d.discs.length} 个学科`;

    // 时序保护：中文核心数据可能比用户的 PDF/DOI 查询晚到。
    // 若结果区已有内容且当时不带中文核心，用新数据重绘一次。
    if (STATE.lastResults && $('results') && $('results').innerHTML.trim()) {
      const lr = STATE.lastResults;
      STATE.lastResults = null;   // 防重入
      showResults(lr.matches, lr.source, lr.unknownJournal);
    }
  } catch(e) {
    console.error('CN data load error:', e);
    const stat = $('cnStat');
    if (stat) stat.textContent = '中文核心数据加载失败，请刷新重试';
  }
}

// ==================== Name Normalization ====================
function normalizeName(name) {
  return name.toLowerCase().trim()
    .replace(/^the\s+/i, '')       // strip leading "The "
    .replace(/&amp;/g, 'and')
    .replace(/&/g, 'and')
    .replace(/  +/g, ' ')
    .replace(/[–—]/g, '-');
}

// ==================== Search ====================
function searchJournals(query) {
  if (!query || query.length < 2) return [];
  const q = normalizeName(query);
  const byIssn = q.replace(/[^0-9]/g, '');
  const names = STATE.namesLower;
  const journals = STATE.journals;
  const len = journals.length;
  const results = [];
  
  // Query variants
  const qs = [q];
  const noPrefix = q.replace(/^(npj|the|journal of|international journal of)\s+/i, '').trim();
  if (noPrefix && noPrefix !== q) qs.push(noPrefix);
  
  for (let i = 0; i < len; i++) {
    const name = names[i];
    let matched = false;
    for (let qi = 0; qi < qs.length; qi++) {
      if (name.indexOf(qs[qi]) !== -1) { matched = true; break; }
    }
    if (!matched && byIssn) {
      const issn = (journals[i][1] || '').replace(/-/g, '');
      if (issn.indexOf(byIssn) !== -1) matched = true;
    }
    if (!matched) {
      const words = qs[0].split(/\s+/).filter(w => w.length > 2);
      if (words.length && words.every(w => name.indexOf(w) !== -1)) matched = true;
    }
    
    if (matched) {
      results.push({idx: i, j: journals[i]});
      if (results.length >= 20) break;
    }
  }
  
  results.sort((a, b) => {
    const aName = names[a.idx];
    const bName = names[b.idx];
    const aExact = aName === q ? 0 : aName.startsWith(q) ? 1 : 2;
    const bExact = bName === q ? 0 : bName.startsWith(q) ? 1 : 2;
    if (aExact !== bExact) return aExact - bExact;
    return (b.j[2] || 0) - (a.j[2] || 0);
  });
  
  return results.map(r => r.j);
}

// Exact match — uses normalized names + &/and swap
function searchJournalsExact(name) {
  if (!name) return null;
  const q = normalizeName(name);
  const idx = STATE.namesLower.indexOf(q);
  if (idx !== -1) return STATE.journals[idx];
  const qAlt = q.includes('and') ? q.replace(' and ', ' & ') : q.replace(' & ', ' and ');
  if (qAlt !== q) {
    const idx2 = STATE.namesLower.indexOf(qAlt);
    if (idx2 !== -1) return STATE.journals[idx2];
  }
  return null;
}

function showSuggestions(results) {
  const el = $('suggestions');
  if (!results.length) { el.classList.remove('show'); return; }
  
  el.innerHTML = results.map((j, i) => {
    let xrBadge = '';
    if (j[4]) xrBadge = `<span class="badge badge-q${j[4].charAt(0)}">新锐 ${j[4]}</span>`;
    const ifText = j[2] ? `IF ${j[2]}` : '';
    return `<div class="sug-item" data-idx="${i}">
      <div class="sug-name">${esc(j[0])}</div>
      <div class="sug-meta">${xrBadge}<span style="color:#888">${ifText}</span></div>
    </div>`;
  }).join('');
  
  el.classList.add('show');
}

// ==================== DOI Lookup ====================
async function lookupDoi(doi) {
  const clean = doi.trim().replace(/^https?:\/\/doi\.org\//i, '');
  if (!clean) return null;
  
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const resp = await fetch(`https://api.crossref.org/works/${encodeURIComponent(clean)}`, {
      headers: { 'Accept': 'application/json' },
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!resp.ok) return null;
    const data = await resp.json();
    const msg = data.message;
    
    return {
      title: msg.title ? msg.title[0] : '',
      journal: msg['container-title'] ? msg['container-title'][0] : '',
      issn: msg.ISSN ? msg.ISSN[0] : '',
      doi: msg.DOI || clean
    };
  } catch(e) {
    console.error('CrossRef error:', e);
    return null;
  }
}

// ==================== URL → DOI Extraction ====================
function extractDoiFromUrl(url) {
  // Already a DOI
  if (/^10\.\d{4,}\//.test(url)) return url.trim();
  // doi.org redirects
  const doiOrg = url.match(/doi\.org\/(10\.\d{4,}\/[\w.\-+/()]+)/i);
  if (doiOrg) return doiOrg[1];
  // Common publisher URL patterns (only those that contain actual DOIs)
  const patterns = [
    // These URLs embed the DOI directly
    /link\.springer\.com\/article\/(10\.\d{4,}\/[\w.\-+/()]+)/i,
    /tandfonline\.com\/doi\/(?:full|abs|pdf)\/(10\.\d{4,}\/[\w.\-+/()]+)/i,
    /wiley\.com\/doi\/(?:full|abs|pdf)\/(10\.\d{4,}\/[\w.\-+/()]+)/i,
    /nature\.com\/articles\/([\w.-]+)/i,
    /journals\.sagepub\.com\/doi\/(?:full|abs|pdf)\/(10\.\d{4,}\/[\w.\-+/()]+)/i,
    /doi\/(10\.\d{4,}\/[\w.\-+/()]+)/i,
    // Sciencedirect PII codes are NOT DOIs - skip them
    // mdpi ISSN-based URLs may not have DOI - try generic below
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m && /^10\./.test(m[1])) return m[1];
  }
  // Generic: find any DOI-like pattern in the URL
  const doiMatch = url.match(/10\.\d{4,}\/[\w.\-+/()]+/i);
  if (doiMatch) return doiMatch[0];
  // Detect known publisher URLs that lack DOIs
  if (/sciencedirect\.com\/science\/article\/pii\//i.test(url)) {
    showToast('此 ScienceDirect 链接不含DOI，请打开论文页面复制DOI');
    return null;
  }
  if (/mdpi\.com/i.test(url) || /ieeexplore\.ieee\.org/i.test(url)) {
    showToast('此链接中未检测到DOI，请手动复制DOI');
    return null;
  }
  return null;
}

// ==================== Clipboard Check ====================
async function checkClipboard() {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const text = await navigator.clipboard.readText();
      if (!text) return;
      const doi = extractDoiFromUrl(text.trim());
      if (doi && doi.length > 8) {
        $('doiInput').value = doi;
        showToast(`检测到剪贴板中的DOI: ${doi.substring(0,25)}...`);
      }
    }
  } catch(e) {} // Clipboard API may fail silently on some browsers
}

// ==================== Batch Search ====================
async function doBatchSearch(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
  if (!lines.length) { showToast('请输入至少一条查询'); return; }
  if (lines.length > 20) { showToast('最多支持20条批量查询'); return; }
  
  $('results').innerHTML = '';
  $('emptyState').classList.add('hidden');
  showLoading(`批量查询 ${lines.length} 条...`);
  
  for (const line of lines) {
    // Try as DOI first
    const doi = extractDoiFromUrl(line);
    if (doi && /^10\./.test(doi)) {
      const info = await lookupDoi(doi);
      if (info && info.journal) {
        const exact = searchJournalsExact(info.journal);
        let matches = exact ? [exact] : searchJournals(info.journal);
        if (matches.length) {
          showResults(matches, `DOI: ${esc(doi)} → ${esc(info.journal)}`);
        } else {
          showResults([], '', { journal: info.journal, title: info.title, doi: info.doi });
        }
      } else {
        showResults([], '', { journal: line.substring(0, 40) });
      }
    } else {
      // Journal name search
      const exact = searchJournalsExact(line);
      let matches = exact ? [exact] : searchJournals(line);
      if (matches.length) {
        showResults(matches, `搜索: ${esc(line)}`);
      } else {
        showResults([], '', { journal: line });
      }
    }
    await new Promise(r => setTimeout(r, 400)); // Rate limit CrossRef
  }
  
  hideLoading();
}

// ==================== PDF Parse ====================
async function parsePdf(file) {
  if (!window.pdfjsLib) {
    showToast('PDF解析库加载中，请稍后重试');
    return null;
  }
  
  try {
    if (!pdfjsLib.GlobalWorkerOptions.workerSrc) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = (pdfJsBase || PDFJS_BASES[0]) + 'pdf.worker.min.js';
    }
    const buf = await file.arrayBuffer();

    // 中文期刊的刊名几乎只出现在页眉或页脚。正文里出现的刊名多半是参考文献
    // （比如引用了《硅酸盐学报》），拿去做判定会误报，所以按坐标把每页顶部 15%、
    // 底部 13% 的文字单独摘出来，正文全文只留作最后的兜底。
    // 另外中文期刊 PDF 的正文常用 GBK-EUC-H 等 CJK 编码嵌入，不提供 CMap 时
    // getTextContent() 直接返回空，中文论文便完全识别不了；但 CMap 要多一次网络
    // 请求，英文 PDF 不该白等，所以做成「先默认解析、解不出才带 CMap 重试」。
    const readPageZones = async (doc, n) => {
      try {
        const page = await doc.getPage(n);
        const vp = page.getViewport({ scale: 1 });
        const tc = await page.getTextContent();
        const H = vp.height || 1;
        const head = [], foot = [], all = [];
        for (const it of tc.items) {
          const s = it.str;
          if (!s) continue;
          all.push(s);
          const y = it.transform[5];
          if (y > H * 0.85) head.push(s);
          else if (y < H * 0.13) foot.push(s);
        }
        return { head: head.join(' '), foot: foot.join(' '), all: all.join(' ') };
      } catch(e) { return { head: '', foot: '', all: '' }; }
    };
    // 前 3 页一起取：有的刊首页只印英文名，中文刊名在第 2 页页脚（如《混凝土世界》）。
    const readHead = async (doc) => {
      const max = Math.min(3, doc.numPages || 1);
      const zs = [];
      for (let p = 1; p <= max; p++) {
        const z = await readPageZones(doc, p);
        zs.push(z);
        if (p === 1 && !z.all) break;   // 第一页就空白 → 多半需要 CMap，先不必白读后面
      }
      return zs;
    };
    const fresh = () => new Uint8Array(buf.slice(0));   // pdf.js 会接管缓冲区，重试必须给新副本

    let pdf = await pdfjsLib.getDocument({ data: fresh() }).promise;
    let zones = await readHead(pdf);

    if (!zones.map(z => z.all).join('').trim()) {
      for (const cu of CMAP_BASES) {
        try {
          const doc2 = await Promise.race([
            pdfjsLib.getDocument({ data: fresh(), cMapUrl: cu, cMapPacked: true }).promise,
            new Promise((_, rej) => setTimeout(() => rej(new Error('cmap timeout')), 12000))
          ]);
          const z2 = await readHead(doc2);
          if (z2.map(z => z.all).join('').trim()) { pdf = doc2; zones = z2; break; }
          if (doc2.destroy) doc2.destroy();
        } catch(e) { /* 这个源不通就换下一个；都不通则沿用无 CMap 的结果 */ }
      }
    }

    const firstPageText = (zones[0] && zones[0].all) || '';
    // 每页的「页眉 页脚」各自成行排在最前，第 1 页全文压到最后作兜底
    const headText = zones.map(z => (z.head + ' ' + z.foot).trim()).filter(Boolean).join('\n')
                   + '\n' + firstPageText;


    const meta = await pdf.getMetadata();
    const info = meta.info || {};

    // Extract DOI from various possible fields
    let doi = info.DOI || info.doi || '';
    if (!doi && firstPageText) {
      const doiMatch = firstPageText.match(/10\.\d{4,}\/[\w.\-+/()]+/i);
      if (doiMatch) doi = doiMatch[0];
    }
    
    // Extract journal name from multiple possible metadata fields
    // /Subject often contains "Journal Name, doi:..." (Springer/Elsevier PDFs)
    let journal = info['Journal'] || info['Container-title'] || info['PrismPublicationName'] || '';
    let subjectJournal = '';
    if (!journal && info.Subject) {
      // Subject format: "npj Materials Sustainability, doi:10.1038/..."
      const subjParts = info.Subject.split(',');
      const firstPart = subjParts[0].trim();
      // Check if it looks like a journal name (not a DOI)
      if (firstPart && !firstPart.startsWith('doi:') && !/^10\.\d{4,}\//.test(firstPart)) {
        subjectJournal = firstPart;
        journal = firstPart;
      }
      // Also check if Subject contains a DOI
      if (!doi) {
        const subjDoi = info.Subject.match(/10\.\d{4,}\/[\w.\-+/()]+/i);
        if (subjDoi) doi = subjDoi[0];
      }
    }
    
    return {
      title: info.Title || '',
      journal: journal,
      issn: info.ISSN || '',
      doi: doi || '',
      firstPageText: firstPageText,
      headText: headText
    };
  } catch(e) {
    console.error('PDF parse error:', e);
    return null;
  }
}

// ==================== Render ====================
function renderCard(m, extraClass = '') {
  const [name, issn, jif, jcrQ, xrCat, xrQ, wosIdx, wosSubj] = m;
  const cnHit = findCn(name);          // 中文核心联查（数据未就绪时返回 null）
  const xrColorClass = xrQ ? (xrQ === '1区' ? 'badge-q1' : xrQ === '2区' ? 'badge-q2' : xrQ === '3区' ? 'badge-q3' : 'badge-q4') : '';
  const jcrColorClass = jcrQ ? 'badge-' + jcrQ.toLowerCase() : '';
  const wosBadge = wosIdx ? wosIdx.split(' | ').map(i => `<span style="display:inline-block;background:#e8f5e9;color:#2e7d32;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:600;margin:0 2px">${i}</span>`).join('') : '';
  const wosSubjShort = wosSubj ? wosSubj.split(' | ').slice(0, 3).join(' · ') : '';
  
  let h = `<div class="result-card ${extraClass}"${extraClass ? ' style="display:none"' : ''}>
    <div class="result-title">${esc(name)}${cnTitleBadge(cnHit)}</div>
    <div class="result-issn">${issn ? 'ISSN ' + issn : ''}${wosBadge ? '  ' + wosBadge : ''}</div>
    <div class="result-grid">`;
  if (xrCat || xrQ) {
    h += `<div class="result-item full">
      <div class="label">新锐分区</div>
      <div class="value">${xrQ ? '<span class="badge ' + xrColorClass + '" style="font-size:18px;padding:6px 20px">' + xrQ + '</span>' : '-'}</div>
    </div>`;
  }
  if (jcrQ) {
    h += `<div class="result-item">
      <div class="label">JCR分区</div>
      <div class="value">${'<span class="badge ' + jcrColorClass + '" style="font-size:15px;padding:4px 14px">' + jcrQ + '</span>'}</div>
    </div>`;
  }
  if (xrCat) {
    h += `<div class="result-item">
      <div class="label">新锐大类</div>
      <div class="value" style="font-size:${jcrQ ? '14px' : '16px'};color:var(--text)">${xrCat}</div>
    </div>`;
  }
  h += `<div class="result-item">
      <div class="label">影响因子</div>
      <div class="value" style="color:var(--text)">${jif != null ? jif : '-'}</div>
    </div>`;
  h += cnCardBlock(cnHit);
  if (wosSubjShort) {
    h += `<div class="result-item full" style="padding:8px 12px;text-align:left">
      <div class="label" style="margin-bottom:2px">WoS学科</div>
      <div class="value" style="font-size:12px;font-weight:400;color:var(--sub)">${esc(wosSubjShort)}</div>
    </div>`;
  }
  h += `</div></div>`;
  return h;
}

function showResults(matches, source = '', unknownJournal = null, append = false) {
  const el = $('results');

  // 记下本次查询参数，供中文核心数据晚到时重绘
  if (!append) STATE.lastResults = { matches, source, unknownJournal };

  // In append mode (multi-PDF), skip if no results to avoid noise
  if (append && !matches.length && !unknownJournal) return;
  if (!append) el.innerHTML = '';

  // Case: no matches in database, but we identified a journal via CrossRef
  if (!matches.length && unknownJournal) {
    $('emptyState').classList.add('hidden');
    const rawName = unknownJournal.journal || unknownJournal.name || '';
    const jn = esc(rawName);
    const title = esc(unknownJournal.title || '');
    const doi = esc(unknownJournal.doi || '');
    const cnHit = findCn(rawName);
    
    let html = `<div class="result-card" style="border-left:3px solid ${cnHit ? '#c0392b' : '#e67e22'}">
      <div class="result-title">${jn || '未知期刊'}${cnTitleBadge(cnHit)}</div>
      <div class="result-issn">${doi ? 'DOI: ' + doi : ''}</div>`;
    if (title) html += `<div style="font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.4">${title}</div>`;
    
    html += `<div class="result-grid">
      <div class="result-item full">
        <div class="label">新锐分区</div>
        <div class="value" style="font-size:14px;color:#e67e22">暂未收录</div>
      </div>
      <div class="result-item">
        <div class="label">新锐大类</div>
        <div class="value" style="font-size:12px;color:var(--sub)">-</div>
      </div>
      <div class="result-item">
        <div class="label">影响因子</div>
        <div class="value" style="font-size:14px;color:var(--sub)">-</div>
      </div>
      ${cnCardBlock(cnHit)}
    </div>
    <div style="margin-top:12px;padding:8px 10px;background:${cnHit ? '#fdf3f2' : '#fef9f0'};border-radius:8px;font-size:12px;color:${cnHit ? '#c0392b' : '#b87333'};line-height:1.5">
      ${cnHit
        ? `该刊未被新锐分区数据库收录（无影响因子 / JCR 分区），但属于《中文核心期刊要目总览》(2023年版) 收录期刊 —— 投稿或成果认定时可按北大核心口径使用。`
        : '该期刊暂未被新锐分区数据库收录。可能是新创期刊或尚未被索引。'}
    </div></div>`;
    
    if (source) {
      html = `<div style="font-size:12px;color:var(--sub);margin-bottom:8px">${source}</div>` + html;
    }
    if (append) {
      el.insertAdjacentHTML('beforeend', html);
    } else {
      el.innerHTML = html;
    }
    return;
  }
  
  // Case: no matches at all
  if (!matches.length) {
    if (!append) {
      el.innerHTML = `<div class="state"><div class="icon">😕</div><div class="msg">未找到匹配的期刊<br>请尝试用ISSN或完整期刊名搜索</div></div>`;
      $('emptyState').classList.add('hidden');
    }
    return;
  }
  
  $('emptyState').classList.add('hidden');
  
  // Source info + result count
  const frag = document.createDocumentFragment();
  if (source) {
    const srcDiv = document.createElement('div');
    srcDiv.style.cssText = 'font-size:12px;color:var(--sub);margin-bottom:8px';
    srcDiv.innerHTML = source;
    frag.appendChild(srcDiv);
  }
  if (matches.length > 1) {
    const cntDiv = document.createElement('div');
    cntDiv.style.cssText = 'text-align:center;font-size:11px;color:#aaa;margin-bottom:8px';
    cntDiv.textContent = `共 ${matches.length} 条结果`;
    frag.appendChild(cntDiv);
  }
  
  const MAX_VISIBLE = 5;
  const showAll = matches.length <= MAX_VISIBLE;
  const visible = showAll ? matches : matches.slice(0, MAX_VISIBLE);
  
  const wrapper = document.createElement('div');
  visible.forEach(m => { wrapper.innerHTML += renderCard(m); });
  frag.appendChild(wrapper);
  
  if (!showAll) {
    const btnDiv = document.createElement('div');
    btnDiv.style.cssText = 'text-align:center;padding:8px';
    btnDiv.innerHTML = `<button onclick="this.remove();document.querySelectorAll('.result-folded').forEach(el=>{el.style.display='';el.style.animation='fadeIn .3s ease'})"
      style="background:none;border:1px solid var(--blue);color:var(--blue);padding:8px 24px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit">
      显示全部 ${matches.length} 条结果</button>`;
    frag.appendChild(btnDiv);
    const hiddenWrap = document.createElement('div');
    for (let i = MAX_VISIBLE; i < matches.length; i++) {
      hiddenWrap.innerHTML += renderCard(matches[i], 'result-folded');
    }
    frag.appendChild(hiddenWrap);
  }
  
  if (!append) el.innerHTML = '';
  el.appendChild(frag);
  // Auto-scroll to results (only on first render)
  if (!append) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ==================== 中文核心 (北大核心 2023) ====================
// 归一化：忽略空格、括号、间隔号、连字符、点号的差异
function normalizeCn(name) {
  return (name || '').toLowerCase()
    .replace(/&amp;/g, '和')
    .replace(/[\s\u3000]+/g, '')
    .replace(/[（）()\[\]【】〔〕]/g, '')
    .replace(/[·・•‧.。]/g, '')
    .replace(/[—–\-‐－_]/g, '')
    .replace(/[：:]/g, '')
    .replace(/[、，,／/]/g, '');
}

// 按刊名在中文核心库中联查。命中返回条目 [刊名, 学科下标, 学科内序号, 编下标, 总序号]，否则 null。
// 匹配分三级，逐级放宽，但每级都设了防误判门槛（宁可返回 null 也不给错刊）。
function findCn(name) {
  const cn = STATE.cn;
  if (!cn || !cn.cnMap || !name) return null;
  const raw = String(name);
  const key = normalizeCn(raw);
  if (!key) return null;

  // 1) 归一化后精确匹配
  const hit = cn.cnMap.get(key);
  if (hit) return hit;

  // 2) 剥掉尾部括号补充说明（如「（中文版）」「(网络版)」）后精确匹配
  const stripped = normalizeCn(raw.replace(/[（(【\[][^）)】\]]{1,24}[）)】\]]/g, ''));
  if (stripped && stripped !== key) {
    const h2 = cn.cnMap.get(stripped);
    if (h2) return h2;
  }

  // 3) 前缀级匹配。PDF 提取的刊名要么被截断（是完整刊名的前缀），
  //    要么带尾部残留（完整刊名 + 期号/年份/副标题）。两种都只认前缀关系，
  //    不做任意位置包含 —— 否则「土木与环境工程学报」会歧义到「环境工程学报」。
  if (key.length < 4) return null;
  const names = cn.names, J = cn.journals;

  // 3a) 库中刊名以查询串开头：要求唯一，多了说明查询串不完整 → 不认
  let cand = null, n = 0;
  for (let i = 0, len = names.length; i < len; i++) {
    const nm = names[i];
    if (!nm || nm.length < 4) continue;
    if (nm.startsWith(key)) { cand = J[i]; if (++n > 1) return null; }
  }
  if (n === 1) return cand;

  // 3b) 查询串以库中刊名开头（尾部有残留）：取最长匹配，并列则不认
  let best = null, bestLen = 0, tie = false;
  for (let i = 0, len = names.length; i < len; i++) {
    const nm = names[i];
    if (!nm || nm.length < 4) continue;
    if (key.startsWith(nm)) {
      if (nm.length > bestLen) { best = J[i]; bestLen = nm.length; tie = false; }
      else if (nm.length === bestLen) tie = true;
    }
  }
  return (best && !tie) ? best : null;
}

// 卡片内的中文核心信息块（PDF / DOI / 刊名搜索共用）
function cnCardBlock(cnHit) {
  if (!STATE.cn) return '';   // 数据未就绪时不显示，避免误报「未收录」
  if (!cnHit) {
    return `<div class="result-item full" style="padding:8px 12px;text-align:left">
      <div class="label" style="margin-bottom:2px">中文核心</div>
      <div class="value" style="font-size:12px;font-weight:400;color:#bbb">未收录（非北大中文核心）</div>
    </div>`;
  }
  const disc = STATE.cn.discs[cnHit[1]] || '';
  const cnt = STATE.cn.discCounts[cnHit[1]] || 0;
  const ed = STATE.cn.editions[cnHit[3]] || '';
  return `<div class="result-item full" style="padding:9px 12px;text-align:left;background:#fdf3f2;border-radius:8px">
      <div class="label" style="margin-bottom:3px">中文核心</div>

// 中文核心刊名反向定位。
// 中文期刊 PDF 普遍不带出版社元数据（journal 字段为空，或是「OCR-PDF」这类软件名），
// 仅靠元数据识别不了。这里用 1987 条刊名表去首页正文里扫，取出现位置最靠前的那个 ——
// 中文期刊的刊名一般在页眉/篇首，而参考文献在文末，position 最靠前的最可能就是它。
function cnFindInText(text) {
  const cn = STATE.cn;
  if (!cn || !cn.names || !text) return null;

  // 只在给定范围内找。requireUnique=true 时要求全范围只有一本刊命中，
  // 否则说明这段文字里顺带提了别的刊物，结论不可靠。
  const scan = (scope, requireUnique) => {
    let best = null, bestPos = Infinity, bestLen = -1, count = 0;
    const names = cn.names, J = cn.journals;
    for (let i = 0, n = names.length; i < n; i++) {
      const nm = names[i];
      // 少于 4 字的刊名（如「混凝土」）是正文里的高频词，命中无意义，直接排除
      if (!nm || nm.length < 4) continue;
      const p = scope.indexOf(nm);
      if (p < 0) continue;
      if (requireUnique) {
        if (++count > 1) return null;
        best = J[i];
        continue;
      }
      if (p < bestPos || (p === bestPos && nm.length > bestLen)) {
        best = J[i]; bestPos = p; bestLen = nm.length;
      }
    }
    return best;
  };

  const scanOne = (piece) => {
    const norm = normalizeCn(piece);
    if (norm.length < 6) return null;
    // 第一轮：篇首 400 字内取最靠前的
    // 第二轮：仍无果才放开到整段，但必须唯一命中
    return scan(norm.slice(0, 400), false) || scan(norm, true);
  };

  // 按行分段扫（调用方把每页的「页眉+页脚」各自放一行，末尾接第 1 页全文）。
  // 逐段来而不是拼在一起，是为了让「靠前那页先说话」：页眉页脚命中就该拍板，
  // 不能被后面正文里的参考文献把唯一性判据搅黄。
  const parts = String(text).split('\n');
  for (const pt of parts) {
    const hit = scanOne(pt);
    if (hit) return hit;
  }
  return null;
}

// 正文兜底识别。命中则直接出结果并返回 true；未命中返回 false，交回原流程。
function cnTextFallback(info, source, appendMode) {
  if (!info || !STATE.cn) return false;
  const text = info.headText || info.firstPageText || '';
  if (!text) return false;
  const hit = cnFindInText(text);
  if (!hit) return false;
  const nm = hit[0];
  const srcX = `PDF正文识别: ${esc(nm)}`;
  const mX = searchJournals(nm);

  if (mX.length) {                       // 新锐库里也有 → 正常卡片（已含中文核心块）
    if (info.title) source += `<br>${esc(info.title)}`;
    if (appendMode) {
      $('results').insertAdjacentHTML('beforeend',
        `<div style="font-size:11px;color:#aaa;padding:4px 0 8px">${srcX}</div>` + mX.map(m => renderCard(m)).join(''));
    } else {
      showResults(mX, srcX);
    }
    return true;
  }

  // 新锐库里没有，但中文核心有 → 直接出中文核心卡片，避免误报「未收录」
  if (appendMode) {
    $('results').insertAdjacentHTML('beforeend',
      `<div class="result-card" style="border-left:3px solid #c0392b;margin-bottom:12px">
        <div class="result-title">${esc(nm)}${cnTitleBadge(hit)}</div>
        <div class="result-grid">${cnCardBlock(hit)}</div>
      </div>`);
  } else {
    showResults([], srcX, { journal: nm, title: info.title });
  }
  return true;
}

// 搜索：前缀命中优先，其次包含命中
function searchCnJournals(query, limit = 40) {
  const cn = STATE.cn;
  if (!cn || !query) return [];
  const q = normalizeCn(query);
  if (!q) return [];
  const names = cn.names, J = cn.journals;
  const starts = [], contains = [];
  for (let i = 0, n = J.length; i < n; i++) {
    const p = names[i].indexOf(q);
    if (p === 0) starts.push(J[i]);
    else if (p > 0) contains.push(J[i]);
    if (starts.length >= limit) break;
  }
  return starts.concat(contains).slice(0, limit);
}

function showCnResults(list, source = '', query = '', append = false) {
  const el = $('results');
  if (!append) el.innerHTML = '';
  $('emptyState').classList.add('hidden');

  if (!list.length) {
    if (append) return;
    const tot = STATE.cn ? STATE.cn.total : 1987;
    el.innerHTML = `<div class="state"><div class="icon">😕</div><div class="msg">未找到「${esc(query)}」<br>2023 版北大核心共收录 ${tot} 种中文期刊<br><span style="font-size:12px;color:#aaa">可尝试期刊简称，如"岩土""建筑结构"</span></div></div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  if (source) {
    const s = document.createElement('div');
    s.style.cssText = 'font-size:12px;color:var(--sub);margin-bottom:8px;line-height:1.5';
    s.innerHTML = source;
    frag.appendChild(s);
  }
  if (list.length > 1) {
    const c = document.createElement('div');
    c.style.cssText = 'text-align:center;font-size:11px;color:#aaa;margin-bottom:8px';
    c.textContent = `共 ${list.length} 种`;
    frag.appendChild(c);
  }

  const MAX = 30;
  const wrap = document.createElement('div');
  list.slice(0, MAX).forEach(m => { wrap.innerHTML += renderCnCard(m); });
  frag.appendChild(wrap);

  if (list.length > MAX) {
    const btnDiv = document.createElement('div');
    btnDiv.style.cssText = 'text-align:center;padding:8px';
    btnDiv.innerHTML = `<button onclick="this.remove();document.querySelectorAll('.cn-folded').forEach(el=>{el.style.display='';el.style.animation='fadeIn .3s ease'})"
      style="background:none;border:1px solid #c0392b;color:#c0392b;padding:8px 24px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit">
      显示全部 ${list.length} 种</button>`;
    frag.appendChild(btnDiv);
    const hw = document.createElement('div');
    for (let i = MAX; i < list.length; i++) hw.innerHTML += renderCnCard(list[i], 'cn-folded');
    frag.appendChild(hw);
  }

  el.appendChild(frag);
  if (!append) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  area.dataset.rendered = '1';

async function doDoiSearch(doi) {
  if (!doi) return;
  showLoading('通过DOI查询期刊信息...');
  
  const info = await lookupDoi(doi);
  hideLoading();
  
  if (!info || (!info.journal && !info.issn)) {
    showResults([], '', null);
    showToast('未找到该DOI对应的期刊信息');
    return;
  }
  
  // Search local database: ISSN first (most reliable), then exact name
  let matches = [];
  if (info.issn) {
    const cleanIssn = info.issn.replace(/-/g, '');
    matches = STATE.journals.filter(j => (j[1] || '').replace(/-/g, '') === cleanIssn).slice(0, 1);
  }
  if (!matches.length && info.journal) {
    matches = [searchJournalsExact(info.journal)].filter(Boolean);
  }
  // Fallback to broad search
  if (!matches.length && info.journal) matches = searchJournals(info.journal);
  
  const source = info.title ? `📄 ${esc(info.title)}<br>DOI: ${esc(doi)}` : `DOI: ${esc(doi)}`;
  if (!matches.length) {
    showResults([], source, { journal: info.journal, title: info.title, doi: info.doi });
  } else {
    showResults(matches, source);
  }
}

async function processPdf(file, idx = 1, total = 1) {
  if (file.size > 80 * 1024 * 1024) {
    showToast(`${file.name.substring(0,30)} 超过80MB，已跳过`);
    return;
  }
  
  const appendMode = idx > 1;
  const label = total > 1 ? ` (${idx}/${total})` : '';
  const sizeMsg = file.size > 30*1024*1024 ? '大型PDF解析中...' : '解析PDF中...';
  $('loadingMsg').textContent = `${sizeMsg}${label}`;
  $('loading').classList.remove('hidden');
  $('emptyState').classList.add('hidden');
  if (!appendMode) $('results').innerHTML = '';
  
  await loadPdfJs();
  if (!pdfJsLoaded) {
    hideLoading();
    showToast('PDF解析库加载失败，请用期刊名或DOI查询');
    return;
  }
  
  const info = await parsePdf(file);
  hideLoading();

  // 「解析失败」和「解析出来了但没元数据」是两回事。以前两者共用一句
  // 「此PDF未包含期刊元数据」，把「根本没读出来」也说成「PDF 没元数据」，
  // 容易让人以为站点坏了 —— 分开报，才知道该往哪儿查。
  if (!info) {
    if (appendMode) {
      showToast(`${file.name.substring(0,30)} 解析失败`);
    } else {
      $('results').innerHTML = `<div class="result-card" style="border-left:3px solid #e67e22">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="font-size:24px;flex-shrink:0">⚠️</div>
          <div>
            <div style="font-size:15px;font-weight:600;margin-bottom:6px">这个 PDF 没能打开</div>
            <div style="font-size:13px;color:var(--sub);line-height:1.6">
              常见原因：文件加密、下载不完整，或解析库没能加载。<br><br>
              <span style="font-weight:500;color:var(--text)">可以先试：</span><br>
              &nbsp;1.&nbsp; 刷新页面后重新上传一次<br>
              &nbsp;2.&nbsp; 换用「<span style="color:var(--blue);font-weight:500">期刊名</span>」或「<span style="color:var(--blue);font-weight:500">DOI</span>」模式查询
            </div>
          </div>
        </div>
      </div>`;
    }
    return;
  }

  if (!info.journal && !info.doi && !info.issn) {
    // 中文期刊 PDF 常常既无元数据也无 DOI。先让中文核心库用刊名表在页眉页脚里反向定位，
    // 认出来了就正常出结果，不再直接判定「无元数据」。
    if (cnTextFallback(info, '', appendMode)) return;
    const readChars = String(info.headText || '').trim().length;
    if (appendMode) {
      showToast(`${file.name.substring(0,30)} 未识别到刊名`);
    } else {
      $('results').innerHTML = `<div class="result-card" style="border-left:3px solid #e67e22">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="font-size:24px;flex-shrink:0">🔍</div>
          <div>
            <div style="font-size:15px;font-weight:600;margin-bottom:6px">没能确认这篇 PDF 的刊名</div>
            <div style="font-size:13px;color:var(--sub);line-height:1.6">
              ${readChars
                ? `已读到 PDF 的文字（页眉页脚共 ${readChars} 字），但没能在北大核心 2023 年版的 1987 种名单里找到对应刊名。`
                : `这个 PDF 里没有可提取的文字（多半是扫描件／图片版），页眉页脚读不出内容。`}<br><br>
              <span style="font-weight:500;color:var(--text)">可能的原因：</span><br>
              &nbsp;1.&nbsp; 该刊<span style="font-weight:500">不属于北大中文核心</span>（行业刊、内部刊等）<br>
              &nbsp;2.&nbsp; 刊名印在扫描图上，PDF 里没有文字层<br>
              &nbsp;3.&nbsp; 版面特殊，刊名不在页眉或页脚<br><br>
              <span style="font-weight:500;color:var(--text)">建议：</span><br>
              &nbsp;·&nbsp; 切到「<span style="color:var(--blue);font-weight:500">期刊名</span>」模式直接输入刊名，立刻就能确认是否属于北大核心<br>
              &nbsp;·&nbsp; 有 DOI 的话用「<span style="color:var(--blue);font-weight:500">DOI</span>」模式
            </div>
          </div>
        </div>
      </div>`;
    }
    return;
  }
  
  let source = '';
  let matches = [];
  
  // Try DOI first
  if (info.doi) {
    source = `DOI: ${esc(info.doi)} `;
    if (!appendMode) {
      $('loadingMsg').textContent = `通过DOI查询期刊信息...${label}`;
      $('loading').classList.remove('hidden');
    }
    const crossrefInfo = await lookupDoi(info.doi);
    hideLoading();
    if (crossrefInfo && crossrefInfo.journal) {
      source += `→ ${esc(crossrefInfo.journal)}`;
      // ISSN match first (most reliable)
      if (crossrefInfo.issn) {
        const cleanIssn = crossrefInfo.issn.replace(/-/g, '');
        const exact = STATE.journals.find(j => (j[1] || '').replace(/-/g, '') === cleanIssn);
        if (exact) matches = [exact];
      }
      if (!matches.length) {
        const exact = searchJournalsExact(crossrefInfo.journal);
        if (exact) matches = [exact];
      }
      if (!matches.length) matches = searchJournals(crossrefInfo.journal);
      if (!matches.length && crossrefInfo.issn) {
        matches = searchJournals(crossrefInfo.issn);
      }
      if (!matches.length) {
        if (appendMode) {
          // Fast append for multi-PDF: skip showResults flow
          const rawJ = crossrefInfo.journal || crossrefInfo.title || '未知期刊';
          const cnHitA = findCn(crossrefInfo.journal || '');
          $('results').insertAdjacentHTML('beforeend',
            `<div class="result-card" style="border-left:3px solid ${cnHitA ? '#c0392b' : '#e67e22'};margin-bottom:12px">
              <div class="result-title">${esc(rawJ)}${cnTitleBadge(cnHitA)}</div>
              <div class="result-grid">
                ${cnHitA ? cnCardBlock(cnHitA) : '<div style="font-size:12px;color:#e67e22;text-align:center;padding:8px">暂未收录</div>'}
              </div>
            </div>`);
        } else {
          showResults([], source, crossrefInfo);
        }
        return;
      }
    }
  }
  
  // Fallback to journal name from PDF metadata
  if (!matches.length && info.journal) {
    source = `PDF提取: ${esc(info.journal)}`;
    matches = searchJournals(info.journal);
    if (!matches.length) {
      // 元数据刊名不可信（可能是「OCR-PDF」这类软件名）→ 先试中文核心正文反向定位
      if (cnTextFallback(info, source, appendMode)) return;
      const cnHitB = findCn(info.journal);
      if (appendMode) {
        $('results').insertAdjacentHTML('beforeend',
          `<div class="result-card" style="border-left:3px solid ${cnHitB ? '#c0392b' : '#e67e22'};margin-bottom:12px">
            <div class="result-title">${esc(info.journal || info.title || '未知期刊')}${cnTitleBadge(cnHitB)}</div>
            <div class="result-grid">
              ${cnHitB ? cnCardBlock(cnHitB) : '<div style="font-size:12px;color:#e67e22;text-align:center;padding:8px">暂未收录</div>'}
            </div>
          </div>`);
      } else {
        showResults([], source, { journal: info.journal, title: info.title, doi: info.doi });
      }
      return;
    }
  }
  
  // 元数据里没有刊名（中文期刊 PDF 常态）→ 中文核心正文兜底
  if (!matches.length && cnTextFallback(info, source, appendMode)) return;

  if (!matches.length && info.issn) {
    matches = searchJournals(info.issn);
    source += ` (ISSN: ${info.issn})`;
  }
  
  if (!matches.length) {
    const cnHitC = findCn(info.journal);
    if (appendMode) {
      $('results').insertAdjacentHTML('beforeend',
        `<div class="result-card" style="border-left:3px solid ${cnHitC ? '#c0392b' : 'var(--border)'};margin-bottom:12px">
          <div class="result-title">${esc(info.journal || info.title || '未识别期刊')}${cnTitleBadge(cnHitC)}</div>
          <div class="result-grid">
            ${cnHitC ? cnCardBlock(cnHitC) : '<div style="font-size:12px;color:var(--sub);text-align:center;padding:8px">未能匹配到数据库</div>'}
          </div>
        </div>`);
    } else {
      showResults([], source, info);
    }
    return;
  }
  
  if (info.title) source += `<br>${esc(info.title)}`;
  if (appendMode) {
    // Fast append for multi-PDF
    const sep = `<div style="font-size:11px;color:#aaa;padding:4px 0 8px">${source}</div>`;
    $('results').insertAdjacentHTML('beforeend', sep + matches.map(m => renderCard(m)).join(''));
  } else {
    showResults(matches, source);
  }
}

// ==================== UI Helpers ====================
function $(id) { return document.getElementById(id); }
function $$(sel) { return document.querySelectorAll(sel); }
function esc(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

function showLoading(msg) {
  $('loading').classList.remove('hidden');
  $('loadingMsg').textContent = msg;
  $('emptyState').classList.add('hidden');
  $('results').innerHTML = '';
}

function hideLoading() {
  $('loading').classList.add('hidden');
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

function debounce(fn, ms) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}

// Click outside to close suggestions
document.addEventListener('click', e => {
  if (!e.target.closest('#modeName')) {
    $('suggestions').classList.remove('show');
  }
  if (!e.target.closest('#modeCn')) {
    $('cnSuggestions').classList.remove('show');
  }
});

// Keyboard dismiss
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('suggestions').classList.remove('show');
    $('cnSuggestions').classList.remove('show');
  }
});

// ==================== Init ====================
loadData();

// WeChat detection
if (/MicroMessenger/i.test(navigator.userAgent)) {
  document.body.classList.add('is-wx');
  const wxDiv = $('wxUpload');
  if (wxDiv) wxDiv.style.display = 'block';
  const wxBtn = $('wxUploadBtn');
  if (wxBtn) wxBtn.addEventListener('click', () => $('pdfInput').click());
}

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
